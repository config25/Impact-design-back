server:
  tomcat:
    threads:
      max: 30
      min-spare: 5

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/impact_design?useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 580000
      connection-timeout: 5000

  jpa:
    show-sql: false

file:
  base-url: http://iptdesign.mycafe24.com/uploads

jwt:
  secret: ${JWT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}

logging:
  file:
    name: /root/logs/impact-design.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: WARN
    qtedu.Impact_design: INFO

cors:
  allowed-origins: http://iptdesign.mycafe24.com
