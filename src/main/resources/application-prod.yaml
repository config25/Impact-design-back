server:
  tomcat:
    threads:
      max: 15
      min-spare: 3
    accept-count: 60
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/impact_design?useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 4
      max-lifetime: 580000
      connection-timeout: 3000
      idle-timeout: 300000

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

file:
  base-url: http://iptdesign.mycafe24.com/uploads

jwt:
  secret: ${JWT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}

logging:
  file:
    name: /root/logs/impact-design.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    root: WARN
    qtedu.Impact_design: INFO

cors:
  allowed-origins: http://iptdesign.mycafe24.com
